<!DOCTYPE html>
<html>
<head>
    <title>Ofisiant Paneli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍽 Ofisiant Paneli</h1>

<h2>Masa:</h2>
<input id="table" type="number" placeholder="Masa nömrəsi">

<h2>Sifariş:</h2>
<select id="meal">
    <option>Dönər</option>
    <option>Lavash</option>
    <option>Pepsi</option>
    <option>Çay</option>
    <option>Fri Kartof</option>
</select>

<h2>Qeyd:</h2>
<input id="note" type="text" placeholder="Məs: Acılı, sous az olsun...">

<button onclick="sendOrder()">📤 Sifarişi Göndər</button>

<script>
function sendOrder() {
    let table = document.getElementById("table").value;
    let meal  = document.getElementById("meal").value;
    let note  = document.getElementById("note").value;

    if (!table) { alert("Masa nömrəsi daxil olunmalıdır!"); return; }

    let order = { meal, table, note, time: new Date().toLocaleTimeString() };

    // Mətbəx üçün sifariş
    let orders = JSON.parse(localStorage.getItem("orders") || "[]");
    orders.push(order);
    localStorage.setItem("orders", JSON.stringify(orders));

    // Admin üçün sifariş (arxiv)
    let adminOrders = JSON.parse(localStorage.getItem("admin_orders") || "[]");
    adminOrders.push(order);
    localStorage.setItem("admin_orders", JSON.stringify(adminOrders));

    alert("✔ Sifariş mətbəxə göndərildi!");
}
</script>

</body>
</html>
